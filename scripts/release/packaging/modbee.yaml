# /etc/modbee/modbee.yaml - docs/settings.md and docs/kafka.md describe every
# key. `sudo modbee check -C /etc/modbee/modbee.yaml` validates it;
# `sudo systemctl restart modbee` applies it.

broker:
  port: 1883
  shards: 0                  # one worker per CPU core

# Logins. The admin is for you, your apps and the modbee command; its
# password was chosen at random when the package was installed. Every device
# gets a login of its own, kept in /var/lib/modbee/auth.db and changed live,
# no restart (docs/logins.md). A login may use only the topics it was given:
# nothing is open by default.
authentication:
  username: admin
  password-file: /etc/modbee/admin-password
  database: /var/lib/modbee/auth.db
  default-topics: none

metrics:
  address: 127.0.0.1         # Prometheus /metrics, this machine only
  port: 9464

# Retained messages and sessions are kept in /var/lib/modbee as well as in
# memory, so a restart or an upgrade keeps them - and a device that comes
# back is sent what it missed.
retained:
  store: file
sessions:
  store: file
