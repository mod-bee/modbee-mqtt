name=ModBee MQTT
version=0.1.1
author=Matthew Reed
maintainer=Matthew Reed
sentence=MQTT 3.1.1 and 5.0 over WiFi, Ethernet or cellular - one object, one poll(), and nothing waits on the network.
paragraph=MqttDevice gives you a working device in about twenty lines: it announces itself online, registers its own Will so its absence is noticed, reconnects by itself, publishes a variable when it moves, and holds what you send while the link is down. It works over any Arduino Client - WiFiClient, EthernetClient, TinyGsmClient for cellular, or SSLClient for TLS on a board whose chip has none - so the same sketch runs on a radio link, a wired panel or a remote site. It speaks MQTT 5.0 and drops to 3.1.1 when the broker is older. QoS 0, 1 and 2 with proper session handling, and anything the connection cannot carry is refused with a named reason rather than silently dropped. Nothing in the library waits on the network, connect() included, so it fits inside a scan cycle. MqttClient underneath is the full form and nothing is hidden. A Sparkplug B edge node and host application are included.
category=Communication
