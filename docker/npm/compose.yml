# modbee (MQTT broker) and Kafka, for a server with Nginx Proxy Manager (NPM).
# Fixed network and addresses; NPM forwards to them. Nothing is published.
# Sized for a small server (1 CPU, 2 GB): together under 1 GB.
#
#   modbee   10.80.80.10   MQTT 1883
#   kafka    10.80.80.11   Kafka 9092 (inside), 9095 (with a password, for NPM)

name: modbee-broker

services:
  modbee:
    image: ghcr.io/mod-bee/modbee-mqtt:latest
    restart: unless-stopped
    depends_on:
      kafka-topics: {condition: service_completed_successfully}
    environment:
      MODBEE_AUTHENTICATION_USERNAME: admin
      MODBEE_AUTHENTICATION_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    mem_limit: 256m
    volumes:
      - ./modbee.yaml:/etc/modbee/modbee.yaml:ro
      - modbee-data:/var/lib/modbee
    networks:
      modbee: {ipv4_address: 10.80.80.10}

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    mem_limit: 640m
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,REMOTE://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,REMOTE://${DOMAIN:?set DOMAIN in .env}:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,REMOTE:SASL_PLAINTEXT
      KAFKA_LISTENER_NAME_REMOTE_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_REMOTE_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required user_app="${KAFKA_PASSWORD:?set KAFKA_PASSWORD in .env}";
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092'"]   # cheap: no Java started
      interval: 10s
      retries: 30
    networks:
      modbee: {ipv4_address: 10.80.80.11}

  # Creates the two topics once, then exits.
  kafka-topics:
    image: apache/kafka:4.3.1
    mem_limit: 256m
    environment:
      KAFKA_HEAP_OPTS: "-Xmx64m"
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in mqtt-messages mqtt-commands; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 6 || exit 1
        done
    restart: "no"
    networks: [modbee]

networks:
  modbee:
    name: modbee
    ipam:
      config:
        - subnet: 10.80.80.0/24

volumes:
  modbee-data:
  kafka-data:
