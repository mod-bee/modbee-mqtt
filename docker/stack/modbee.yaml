# modbee.yaml for docker/stack - docs/kafka.md describes every key.
# Traefik in front of this broker does TLS, so the broker itself listens in
# plain MQTT on the stack's private network only.

broker:
  port: 1883
  shards: 0                  # one per core
  max-connections: 100000

# Logins. Every device has its own, kept in a database in the modbee-data
# volume and changed live - no restart:
#   docker compose exec modbee modbee user add tank-01 --publish 'plant/${username}/#'   a device, by hand
#   docker compose exec modbee modbee key create site-a --site a --publish 'plant/${username}/#'   devices that register themselves
# MQTT_USERNAME / MQTT_PASSWORD from .env (compose.yml passes them in) is the
# ADMIN login: for you, your own apps, and the modbee command. docs/logins.md.
# A device may use only the topics its rules name (--publish / --subscribe);
# one given no rules may use none. For a login that should use every topic,
# give it '#' on purpose. docs/logins.md#what-a-device-may-do
authentication:
  database: /var/lib/modbee/auth.db
  default-topics: none

metrics:
  port: 9464                 # Prometheus, on the private network

# Retained messages: in memory only, so a restart of modbee starts empty. Set
# store: file to keep them in /var/lib/modbee as well, which compose.yml keeps
# in the volume modbee-data.
retained:
  store: memory

# The Kafka pipe is off. To send MQTT to a Kafka you already run, uncomment
# this and set bootstrap-servers to it (docs/docker.md, "Your own Kafka").
#
# kafka:
#   clusters:
#     - id: main
#       bootstrap-servers: kafka-1.example.net:9092
#
#   mqtt-to-kafka:
#     - id: all
#       mqtt-topic-filters: ["#"]
#       kafka-topic: mqtt-messages
#       key: clientid        # each device's messages in one partition, in order
#       headers: all
