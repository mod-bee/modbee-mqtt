# modbee.yaml for docker/compose.yml - docs/kafka.md describes every key.
# `modbee check -C modbee.yaml` validates a file without starting anything.

broker:
  port: 1883
  shards: 0                  # one per core
  max-connections: 100000

metrics:
  port: 9464                 # Prometheus: /metrics, and /healthz

# Retained messages are kept in Kafka as well as memory, in the compacted topic
# modbee-retained (created if missing), so a restart of modbee does not lose
# them. memory keeps them in memory only; file keeps them in /var/lib/modbee.
retained:
  store: kafka

kafka:
  clusters:
    - id: main
      bootstrap-servers: kafka:9092

  mqtt-to-kafka:
    # Everything under plant/ goes to the Kafka topic mqtt-plant, with the
    # topic, QoS and properties as headers.
    - id: plant
      mqtt-topic-filters: ["plant/#"]
      kafka-topic: mqtt-plant
      headers: all

    # Sparkplug B, keyed by group/node so each node's messages stay in order.
    - id: sparkplug
      mqtt-topic-filters: ["spBv1.0/#"]
      kafka-topic: mqtt-sparkplug
      key: "${MQTT_TOPIC_LEVEL_1}/${MQTT_TOPIC_LEVEL_3}"
      headers: all

  kafka-to-mqtt:
    # A record on mqtt-commands with key "pump-7" becomes an MQTT message on
    # plant/pump-7/cmd.
    - id: commands
      kafka-topics: [mqtt-commands]
      mqtt-topic: "plant/${KAFKA_KEY}/cmd"
