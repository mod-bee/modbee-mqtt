# modbee.yaml for docker/all-in-one - docs/kafka.md describes every key.
# Traefik in front of this broker does TLS, so the broker itself listens in
# plain MQTT on the stack's private network only.

broker:
  port: 1883
  shards: 0                  # one per core
  max-connections: 100000

# Logins. Every device has its own, kept in a database in the modbee-data
# volume and changed live - no restart:
#   docker compose exec modbee modbee user add tank-01 --publish 'plant/${username}/#'   a device, by hand
#   docker compose exec modbee modbee key create site-a --site a --publish 'plant/${username}/#'   devices that register themselves
# MQTT_USERNAME / MQTT_PASSWORD from .env (compose.yml passes them in) is the
# ADMIN login: for you, your own apps, and the modbee command. docs/logins.md.
# A device may use only the topics its rules name (--publish / --subscribe);
# one given no rules may use none. For a login that should use every topic,
# give it '#' on purpose. docs/logins.md#what-a-device-may-do
authentication:
  database: /var/lib/modbee/auth.db
  default-topics: none

metrics:
  port: 9464                 # Prometheus, on the private network

# Retained messages are kept in Kafka as well as memory, in the compacted topic
# modbee-retained (created if missing), so a restart of modbee does not lose
# them. memory keeps them in memory only; file keeps them in /var/lib/modbee.
retained:
  store: kafka

kafka:
  clusters:
    - id: main
      bootstrap-servers: kafka:9092    # the Kafka in this compose file

  mqtt-to-kafka:
    # Every MQTT message, to one Kafka topic. The record's value is the payload
    # untouched, and its headers carry the MQTT topic (mqtt-topic), QoS and
    # properties. Narrow the filters, or add mappings, to split it up.
    #
    # The record's KEY is the publisher's client id, not the topic. Kafka keeps
    # order only within a partition, and the key picks the partition: keyed by
    # topic, one device's messages on different topics land on different
    # partitions and are read out of order (a Sparkplug node's NBIRTH after its
    # NDATA). Keyed by publisher, each device's messages share a partition, in
    # the order it sent them - MQTT's own ordering promise. Messages that came
    # from Kafka apps have no publisher, and are written without a key.
    - id: all
      mqtt-topic-filters: ["#"]
      kafka-topic: mqtt-messages
      key: clientid
      headers: all

  kafka-to-mqtt:
    # A record written to the Kafka topic mqtt-commands is published to MQTT,
    # on the topic named by the record's key: key "plant/pump-7/cmd", value
    # "start" becomes an MQTT message "start" on plant/pump-7/cmd.
    - id: commands
      kafka-topics: [mqtt-commands]
      mqtt-topic: "${KAFKA_KEY}"
