# Everything in one file: modbee, Kafka, and Traefik for TLS with a free
# Let's Encrypt certificate.
#
#   1. Point a DNS name (mqtt.example.com) at this server. Open ports 80 and 8883.
#   2. cp .env.example .env   and set DOMAIN, EMAIL and MQTT_PASSWORD.
#   3. docker compose up -d
#
# Devices connect to  mqtts://DOMAIN:8883, and every MQTT message lands in the
# Kafka topic mqtt-messages. Where to reach Kafka from:
#
#   another service in this file, or in another compose project
#     on the network "modbee"        kafka:9092
#   this server (scripts, tools)      localhost:9094
#   another machine on your network   set KAFKA_EXTERNAL_HOST and KAFKA_BIND in .env
#   anywhere, with a password         DOMAIN:9093 over TLS - set KAFKA_PASSWORD in .env
#
# docs/docker.md, "Connecting to Kafka", has examples of each.
name: modbee

services:
  # TLS, and the certificate. Port 80 answers Let's Encrypt's check; 8883 is
  # MQTT over TLS, passed to modbee as plain MQTT on the private network.
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.mqtts.address=:8883
      - --entrypoints.kafka.address=:9093
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --certificatesresolvers.letsencrypt.acme.email=${EMAIL:?set EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --log.level=INFO
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${MQTTS_PORT:-8883}:8883"
      - "${KAFKA_TLS_PORT:-9093}:9093"
    configs:
      - source: traefik-routes
        target: /etc/traefik/dynamic.yml
    volumes:
      - letsencrypt:/letsencrypt
    mem_limit: 256m

  modbee:
    image: ghcr.io/mod-bee/modbee-mqtt:${MODBEE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      kafka-topics: {condition: service_completed_successfully}
    environment:
      # The admin login (.env). Devices have their own: docs/logins.md.
      MODBEE_AUTHENTICATION_USERNAME: ${MQTT_USERNAME:-admin}
      MODBEE_AUTHENTICATION_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    volumes:
      - ./modbee.yaml:/etc/modbee/modbee.yaml:ro
      - modbee-data:/var/lib/modbee        # device logins, and their backups
    ulimits: {nofile: {soft: 1048576, hard: 1048576}}
    mem_limit: 2g
    # Plain MQTT for devices on this LAN as well - uncomment to open it:
    # ports: ["1883:1883"]

  # One Kafka node (KRaft, no ZooKeeper), its data kept in a volume.
  #   kafka:9092   for containers on the "modbee" network - modbee uses this
  #   :9094        for everything outside Docker, published on KAFKA_BIND
  #                (this server only, by default) and announced to clients as
  #                KAFKA_EXTERNAL_HOST:KAFKA_PORT. No password: keep it off
  #                the internet.
  #   :9095        reached only through Traefik, as DOMAIN:9093 with TLS and
  #                the KAFKA_USERNAME / KAFKA_PASSWORD login. With no
  #                KAFKA_PASSWORD it has no users, so it lets nobody in.
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms1g"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094,REMOTE://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_PORT:-9094},REMOTE://${DOMAIN:-localhost}:${KAFKA_TLS_PORT:-9093}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,REMOTE:SASL_PLAINTEXT
      # The login on REMOTE. Traefik does the TLS, so the password never
      # crosses the internet in the clear; SASL/PLAIN over TLS is what
      # managed Kafka services use too.
      KAFKA_LISTENER_NAME_REMOTE_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_REMOTE_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required ${KAFKA_PASSWORD:+user_${KAFKA_USERNAME:-app}="${KAFKA_PASSWORD}"};
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_BIND:-127.0.0.1}:${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
    mem_limit: 2g

  # Runs once at start: creates the topics modbee.yaml uses, then exits.
  # Kafka would create them on their first record anyway, but modbee reads
  # mqtt-commands from the newest record on, so it would miss the record that
  # created it. Add a topic here when you add a mapping that reads one.
  kafka-topics:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in mqtt-messages mqtt-commands; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$topic --partitions 6 || exit 1
        done
    restart: "no"
    mem_limit: 512m

# Named, so another compose project can join it and reach kafka:9092 and
# modbee:1883 by name (docs/docker.md shows the three lines it needs).
networks:
  default:
    name: modbee

# Traefik's routes, kept here so the stack is one file plus .env. Every MQTT
# connection on 8883, and every Kafka connection on 9093, is decrypted with
# the Let's Encrypt certificate for DOMAIN - served even to a client that
# connects by IP address - and passed on: MQTT to modbee, Kafka to its
# password-protected listener.
configs:
  traefik-routes:
    content: |
      tcp:
        routers:
          mqtt:
            entryPoints: [mqtts]
            rule: "HostSNI(`*`)"
            service: modbee
            tls: {}
          kafka:
            entryPoints: [kafka]
            rule: "HostSNI(`*`)"
            service: kafka
            tls: {}
        services:
          modbee:
            loadBalancer:
              servers:
                - address: "modbee:1883"
          kafka:
            loadBalancer:
              servers:
                - address: "kafka:9095"
      tls:
        stores:
          default:
            defaultGeneratedCert:
              resolver: letsencrypt
              domain:
                main: "${DOMAIN:?set DOMAIN in .env}"

volumes:
  letsencrypt:
  kafka-data:
  modbee-data:
