# The tank rule, running next to a docker/examples/*-kafka setup on the same server.
#
#   docker compose up -d --build        (start the *-kafka setup first)
#   docker compose logs -f
#
# It joins that setup's network, "modbee", so it reaches Kafka by
# name at kafka:9092 - no ports to open. If MODBEE_NETWORK renamed that
# network, set the same MODBEE_NETWORK here.
services:
  tank-rule:
    build: .
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
    mem_limit: 256m

networks:
  default:
    name: ${MODBEE_NETWORK:-modbee}
    external: true
