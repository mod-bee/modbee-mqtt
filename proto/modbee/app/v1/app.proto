// ModBee MQTT - the Application API, version 1.
//
// Licensed under the GNU Affero General Public License, Version 3, WITH
// ADDITIONAL TERMS - see LICENSE.
//
// Devices speak MQTT to the broker. An APPLICATION speaks this: gRPC over a
// local socket (or TCP with TLS), served by `modbee serve`. It needs no MQTT
// library. internal/APP-API-SPEC.md is the behaviour behind every call.
//
// Compatibility: within v1 fields and calls are only ever ADDED. A field this
// broker does not know is ignored; one it needs and did not get has its
// default. A change that cannot be made that way is modbee.app.v2, served
// beside v1. System.Hello says which optional features this broker has.

syntax = "proto3";

package modbee.app.v1;

option go_package = "github.com/modbee/modbee-mqtt/proto/modbee/app/v1;appv1";

// =============================================================================
// SYSTEM - who is there, and what this broker can do
// =============================================================================

service System {
  // The first call an application makes. Says which API version and features
  // this broker serves; never refuses an older minor version.
  rpc Hello(HelloRequest) returns (HelloReply);

  // An application instance's presence, for as long as the stream is open.
  // When it ends WITHOUT a Close first (the process died, the socket broke),
  // its wills are published - a Sparkplug host's STATE "offline", say.
  rpc Attach(stream AttachUp) returns (stream AttachDown);
}

message HelloRequest {
  string api_version = 1;          // "1.0": the minor version the app was built against
  string application = 2;          // "platform-backend", "gateway-core": for logs and stats
  string instance = 3;             // this process: host name and pid, a pod name
}

message HelloReply {
  string api_version = 1;          // the highest 1.x this broker serves
  string server_version = 2;       // "modbee-mqtt 1.4.0"
  repeated string features = 3;    // "authority", "consume", "connections", "admin.logins", ...
  string server_id = 4;            // this server, stable across restarts (several in high availability)
}

message AttachUp {
  oneof kind {
    AttachOpen open = 1;           // first, once
    AttachClose close = 2;         // a clean end: the wills are NOT published
  }
}
message AttachOpen {
  string instance = 1;
  repeated Message wills = 2;      // published, in order, if the stream ends without a Close
}
message AttachClose {}
message AttachDown {
  bool opened = 1;
}

// =============================================================================
// AUTHORITY - the broker asks, the application answers
// =============================================================================
//
// Only a CONNECT is asked. The answer carries a Scope - the login's topic
// rules and limits - which the broker applies to every PUBLISH, SUBSCRIBE,
// Will and delivery by itself, so no message ever waits on the application.
// Answers are cached (see Decision.ttl_seconds).

service Authority {
  // The application offers to answer. The broker sends questions down the
  // stream; the application sends one Decision up per question, with its id.
  // Several instances may serve at once: questions are spread across them,
  // and one left unanswered on a stream that ends is asked of another.
  rpc Serve(stream AuthorityUp) returns (stream AuthorityDown);

  // Changes the application makes, at any time, from any instance.
  rpc Revoke(RevokeRequest) returns (RevokeReply);      // forget a login and close its connections
  rpc Regrant(RegrantRequest) returns (RegrantReply);   // live sessions take a new scope, and stay up
  rpc Forget(ForgetRequest) returns (ForgetReply);      // the next CONNECT asks again
}

message AuthorityUp {
  oneof kind {
    AuthorityOpen open = 1;        // first, once
    Decision decision = 2;
  }
}
message AuthorityOpen {
  string instance = 1;
}

message AuthorityDown {
  oneof kind {
    ConnectQuestion connect = 1;
  }
}

message ConnectQuestion {
  uint64 id = 1;
  string client_id = 2;
  optional string username = 3;    // absent: the CONNECT had none
  optional bytes password = 4;
  string address = 5;              // "10.0.4.7:51544"
  Listener listener = 6;
  uint32 protocol_version = 7;     // 4 (3.1.1) or 5
  Certificate certificate = 8;     // set only for a certificate the TLS handshake VERIFIED
}

enum Listener {
  LISTENER_UNSPECIFIED = 0;
  LISTENER_PLAIN = 1;
  LISTENER_TLS = 2;
}

message Certificate {
  string common_name = 1;
  string fingerprint = 2;          // SHA-256 of the DER, 64 lowercase hex
}

message Decision {
  uint64 id = 1;
  bool allow = 2;
  Refusal refusal = 3;             // when allow is false
  uint32 ttl_seconds = 4;          // reuse without asking for this long; 0: ask at every CONNECT
  Scope scope = 5;                 // when allow is true
  optional string login = 6;       // the session's login, when it is not the CONNECT's user name
  bool replace_session = 7;        // may take over a session another login holds under this client id
}

// What the client is told. UNAVAILABLE means "could not check" (the
// application's database is down) - never cached, a cached scope is used
// instead where there is one, and the client is told to come back, not that
// its password is wrong.
enum Refusal {
  REFUSAL_UNSPECIFIED = 0;         // = NOT_AUTHORIZED
  REFUSAL_BAD_CREDENTIALS = 1;     // 0x86 (3.1.1: 4)
  REFUSAL_NOT_AUTHORIZED = 2;      // 0x87 (3.1.1: 5)
  REFUSAL_BANNED = 3;              // 0x8A (3.1.1: 5)
  REFUSAL_QUOTA = 4;               // 0x97 (3.1.1: 3)
  REFUSAL_UNAVAILABLE = 5;         // 0x88 (3.1.1: 3)
}

// A login's rights. Filters may hold ${username} and ${clientid}; a value
// containing '/', '+' or '#' is never put into a filter (the rule then grants
// nothing), so one Scope serves a whole fleet and is kept once.
message Scope {
  repeated string publish = 1;         // topics it may publish to, its Will included
  repeated string subscribe = 2;       // what it may RECEIVE; a SUBSCRIBE inside one is granted
  repeated string subscribe_wide = 3;  // it may also subscribe WITH these, receiving only what `subscribe` allows
  repeated string deny = 4;            // never, whatever the above say: not published, not delivered
  optional uint32 max_sessions = 5;    // absent: the server's default; 0: no limit
  optional uint32 max_retained = 6;
  bytes tag = 7;                       // <= 255 bytes, opaque; rides on every message this session publishes (Delivery.publisher.tag)
}

message RevokeRequest {
  string login = 1;
  Refusal reason = 2;              // what a 5.0 client is told; default NOT_AUTHORIZED
}
message RevokeReply {
  uint32 closed = 1;               // connections closed, on every shard
}

message RegrantRequest {
  string login = 1;
  optional string client_id = 2;   // one session; absent: every session of the login
  Scope scope = 3;
  uint32 ttl_seconds = 4;          // also replaces the cached decision
}
message RegrantReply {
  uint32 sessions = 1;
  uint32 subscriptions_removed = 2; // subscriptions the new scope no longer allows
}

message ForgetRequest {
  optional string login = 1;       // absent: every cached decision
}
message ForgetReply {
  uint64 forgotten = 1;
}

// =============================================================================
// MESSAGES - in and out
// =============================================================================

service Messages {
  // Messages in. Open with a ConsumeOpen, then acknowledge what was handled.
  // Instances that open the same `group` share its messages (consumer-group
  // semantics, internal/APP-API-SPEC.md section 3.2).
  rpc Consume(stream ConsumeUp) returns (stream ConsumeDown);

  // Messages out, one at a time or as a stream (an outbox draining).
  rpc Publish(PublishRequest) returns (PublishReply);
  rpc PublishStream(stream PublishRequest) returns (stream PublishReply);

  // Consumer groups that outlive their members.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsReply);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupReply);
}

message ConsumeUp {
  oneof kind {
    ConsumeOpen open = 1;          // first, once
    Ack ack = 2;                   // handled: never sent again
    Retry retry = 3;               // not handled now: send again later, to any member
  }
}

message ConsumeOpen {
  // Members of one group share its messages; "" is a stream of its own that
  // nothing outlives. A named group is DURABLE: it keeps collecting while no
  // member is connected, until `expiry_seconds` pass with none.
  string group = 1;
  repeated string filters = 2;     // MQTT filters; a $ topic only when named ("$modbee/events/#")
  string connection = 3;           // "" the broker's own clients; else a managed connection's id
  uint32 max_in_flight = 4;        // unacknowledged deliveries this member holds at once (default 100)
  Pick pick = 5;
  bool events = 6;                 // also the client events of the clients whose messages it gets
  uint32 expiry_seconds = 7;       // a named group with no member is kept this long (default 86400)
  OnFull on_full = 8;
  repeated string exclude_origins = 9; // skip messages published through this API with these origins
  // On a managed connection: how it subscribes to each filter on the remote broker. A filter here is one of the
  // group's filters whether `filters` names it or not; one only in `filters` is QoS 1 with no options. On the
  // broker's own clients only the filter counts. Groups on one connection that ask for one filter share one
  // subscription: the highest QoS, no_local only if every group asks for it, retain_as_published and the retained
  // messages if any does. Opening a group that exists with other options changes them.
  repeated Subscription subscriptions = 10;
  // Sparkplug B: a message on spBv1.0/... arrives decoded as well (Delivery.sparkplug) - every datatype, templates,
  // datasets, property sets, arrays, compressed payloads - so the application needs no Sparkplug codec of its own.
  bool sparkplug = 11;
}

message Subscription {
  string filter = 1;
  optional uint32 qos = 2;         // 0 to 2; absent: 1
  bool no_local = 3;               // MQTT 5: not sent what this connection itself published
  bool retain_as_published = 4;    // MQTT 5: `retain` as the publisher set it, not only on the retained copy
  RetainHandling retain_handling = 5; // MQTT 5
}

// A 3.1.1 connection subscribes with the QoS alone; these are MQTT 5's.
enum RetainHandling {
  RETAIN_SEND = 0;                 // the retained messages, at every subscribe (the default)
  RETAIN_SEND_IF_NEW = 1;          // only when the subscription did not exist
  RETAIN_DONT_SEND = 2;
}

enum Pick {
  PICK_PUBLISHER = 0;              // one publisher's messages to one member, in order (the default)
  PICK_ROUND_ROBIN = 1;
}

enum OnFull {
  ON_FULL_REFUSE = 0;              // the publisher is refused (QoS 1/2: 0x97) and keeps the message (the default)
  ON_FULL_DROP = 1;                // dropped and counted
}

message Ack {
  repeated uint64 ids = 1;
}
message Retry {
  repeated uint64 ids = 1;
  uint32 after_ms = 2;
}

message ConsumeDown {
  oneof kind {
    ConsumeOpened opened = 1;      // first, once
    Delivery delivery = 2;
    ClientEvent event = 3;
  }
}

message ConsumeOpened {
  uint32 members = 1;              // connected members of the group, this one included
  uint64 queued = 2;               // what was waiting for the group when it opened
}

message Delivery {
  uint64 id = 1;                   // for Ack and Retry; unique within the stream
  string topic = 2;
  bytes payload = 3;
  uint32 qos = 4;
  bool retain = 5;
  Properties properties = 6;
  Publisher publisher = 7;
  int64 broker_time_ms = 8;        // when the broker accepted it (ms since 1970 UTC): a trusted clock
  bool replay = 9;                 // it waited for the group while no member was connected
  bool redelivered = 10;           // sent before, to a member that did not acknowledge it
  bool will = 11;                  // a Will, published for a client that went
  string connection = 12;          // the managed connection it came in on; "" for the broker's own clients
  SparkplugMessage sparkplug = 13; // ConsumeOpen.sparkplug, on a spBv1.0/... topic: what the payload says
}

message Publisher {
  string client_id = 1;            // "" for the broker's own messages
  string login = 2;                // as the broker checked it (a certificate login: the login it named)
  bytes tag = 3;                   // the publisher's Scope.tag
  string origin = 4;               // published through this API: PublishRequest.origin
}

message ClientEvent {
  ClientEventKind kind = 1;
  uint64 id = 10;                  // for Ack and Retry, as Delivery.id: events are kept and dealt like messages
  string client_id = 2;
  string login = 3;
  int64 time_ms = 4;
  bool resumed = 5;                // CONNECTED: picked up a session the broker held
  uint32 reason_code = 6;          // DISCONNECTED: what the broker sent, or 0 when the client went itself; a refusal: why
  string filter = 7;               // SUBSCRIBED / UNSUBSCRIBED / SUBSCRIBE_REFUSED; PUBLISH_REFUSED: its topic
  uint32 qos = 8;                  // SUBSCRIBED: the QoS granted
  string address = 9;              // CONNECTED, CONNECT_REFUSED, HANDSHAKE_FAILED: where it came from, "10.0.4.7:51544"
  string detail = 11;              // HANDSHAKE_FAILED: why, in the TLS engine's words
}

enum ClientEventKind {
  CLIENT_EVENT_UNSPECIFIED = 0;
  CLIENT_EVENT_CONNECTED = 1;
  CLIENT_EVENT_DISCONNECTED = 2;
  CLIENT_EVENT_SUBSCRIBED = 3;
  CLIENT_EVENT_UNSUBSCRIBED = 4;
  CLIENT_EVENT_SERVER_STARTED = 5; // every session from before is gone or resumed: rebuild from here
  // Refusals, so an application can say why a device is not getting through. `reason_code` is what the device was
  // told; `filter` holds the topic (PUBLISH) or the filter (SUBSCRIBE). A CONNECT refusal is the server's own (full,
  // or the login holds all its sessions) - one the authority decided, the application already knows.
  CLIENT_EVENT_PUBLISH_REFUSED = 6;
  CLIENT_EVENT_SUBSCRIBE_REFUSED = 7;
  CLIENT_EVENT_CONNECT_REFUSED = 8;
  // A TLS handshake failed before any CONNECT: an untrusted or missing client certificate, a protocol or cipher
  // neither end shares, something that is not TLS on the TLS port. No client id - only `address` and `detail`. A
  // connection closed without sending anything (a port check) is not one.
  CLIENT_EVENT_HANDSHAKE_FAILED = 9;
}

message PublishRequest {
  uint64 request_id = 1;           // echoed in the reply (PublishStream)
  string connection = 2;           // "" the broker's own clients; else a managed connection's id
  Message message = 3;
  Confirm confirm = 4;
  string origin = 5;               // who published it, for exclude_origins and Publisher.origin
  // Sparkplug B: the payload, encoded here in place of message.payload (message.topic is still the topic).
  SparkplugPayload sparkplug = 6;
  bool sparkplug_compress = 7;     // and compressed (DEFLATE), as a node does a large birth
}

// When the reply comes. The call's gRPC deadline bounds the wait.
enum Confirm {
  CONFIRM_ACCEPTED = 0;            // the broker took it (routed, queued; with persistence, stored)
  CONFIRM_DELIVERED = 1;           // QoS 1/2: every matching subscriber acknowledged it; on a connection, the remote broker did
}

message PublishReply {
  uint64 request_id = 1;
  PublishOutcome outcome = 2;
  uint32 reason_code = 3;          // the MQTT reason code behind a REFUSED (the remote broker's, on a connection)
  uint32 matched = 4;              // subscribers it matched (the broker's own clients)
  uint32 acknowledged = 5;         // of those, how many acknowledged (CONFIRM_DELIVERED)
  uint32 pending = 6;              // still owed when the deadline came, offline sessions included
}

enum PublishOutcome {
  PUBLISH_OUTCOME_UNSPECIFIED = 0;
  PUBLISH_ACCEPTED = 1;
  PUBLISH_DELIVERED = 2;
  PUBLISH_NO_SUBSCRIBERS = 3;      // taken, and nobody matched (a retained message is still kept)
  PUBLISH_PARTIAL = 4;             // the deadline came with acknowledgements still pending
  PUBLISH_REFUSED = 5;             // see reason_code
  PUBLISH_NOT_CONNECTED = 6;       // the managed connection is down: nothing was sent
  PUBLISH_STORED = 7;              // store and forward: kept on disk, sent in order when the other broker can take it
}

message Message {
  string topic = 1;
  bytes payload = 2;
  uint32 qos = 3;
  bool retain = 4;
  Properties properties = 5;
}

// The MQTT 5 properties that belong to a message, not to one hop.
message Properties {
  optional bool payload_is_utf8 = 1;
  string content_type = 2;
  string response_topic = 3;
  bytes correlation_data = 4;
  optional uint32 message_expiry_seconds = 5;
  repeated UserProperty user_properties = 6;   // in order, repeats kept
}

message UserProperty {
  string name = 1;
  string value = 2;
}

message ListGroupsRequest {}
message ListGroupsReply {
  repeated GroupInfo groups = 1;
}
message GroupInfo {
  string group = 1;
  string connection = 2;
  repeated string filters = 3;
  uint32 members = 4;
  uint64 queued = 5;
  uint64 in_flight = 6;
  uint64 refused = 7;              // publishers refused because it was full
  repeated Subscription subscriptions = 8; // every filter, with how it is subscribed (a managed connection's)
}
message DeleteGroupRequest {
  string group = 1;
  string connection = 2;
}
message DeleteGroupReply {
  uint64 discarded = 1;            // messages it still held
}

// =============================================================================
// SPARKPLUG B - Sparkplug kept once, in the broker
// =============================================================================
//
// What a Sparkplug message says, typed: what every Sparkplug B 3.0 payload can hold, without the application
// carrying a codec. Read from deliveries (ConsumeOpen.sparkplug), written through Messages.Publish
// (PublishRequest.sparkplug), and converted here on their own.

service Sparkplug {
  rpc Decode(SparkplugDecodeRequest) returns (SparkplugMessage);
  rpc Encode(SparkplugEncodeRequest) returns (SparkplugEncodeReply);

  // A Host Application the server runs, on one of its connections (Connections.Put; this_server for its own
  // devices). Its STATE becomes that connection's Will - born at each connect with the Will's own timestamp, made
  // offline before an intended stop, born again if anything says otherwise - and it follows every node's session:
  // bdSeq, seq, aliases. It asks a node to rebirth when its stream cannot be trusted - a gap the reorder window did
  // not close, data from a node with no birth, an alias no birth gave, a payload that does not decode, and every
  // node when its own session begins - at most once a rebirth_min_interval per node. Deliveries on the connection
  // (ConsumeOpen.sparkplug) come with names and datatypes filled in from the births, and say what the host made of
  // them (SparkplugMessage.stale, .gap). Kept in the state directory; stays up while the application restarts.
  rpc PutHost(SparkplugHostSpec) returns (SparkplugHostInfo);
  rpc GetHost(SparkplugHostRef) returns (SparkplugHostInfo);
  rpc ListHosts(Empty) returns (SparkplugHostList);
  rpc DeleteHost(SparkplugHostRef) returns (Empty);           // its STATE made offline first
  // What the host knows of its nodes now: sessions, devices, every declared metric, and the last value of each:
  // numbers, bools, text, bytes, arrays, DataSets and Templates.
  rpc ListNodes(SparkplugNodesRequest) returns (SparkplugNodesReply);
  // Node Control/Rebirth (or, with `device`, Device Control/Rebirth), now - asked by a person, so not limited.
  rpc Rebirth(SparkplugRebirthRequest) returns (SparkplugCommandReply);
  // NCMD / DCMD: metrics by name, sent by the alias and at the datatype their birth gave (any datatype). Node and
  // Device Control metrics too (Next Server, Scan Rate, Reboot).
  rpc Write(SparkplugWriteRequest) returns (SparkplugCommandReply);

  // Sparkplug Aware (Sparkplug B 3.0 section 10): see SparkplugAwareSetting. Changed live. serve --sparkplug-aware.
  rpc GetAware(Empty) returns (SparkplugAwareSetting);
  rpc PutAware(SparkplugAwareSetting) returns (SparkplugAwareSetting);

  // An Edge Node the server runs, on one of its connections (one Will each: a host or an edge node), from the library's
  // TCK-tested node: NDEATH its connection's Will with a new bdSeq each session, NBIRTH and a DBIRTH per device from
  // what it declares (aliases its own), NDATA and DDATA as values are set - deadbands applied - a rebirth when a host
  // asks, and a primary host's STATE waited for. While it is not born, values set are kept on disk and sent, oldest
  // first, with is_historical once it is: Sparkplug's store and forward. A host's writes reach the application on the
  // connection, as NCMD and DCMD (ConsumeOpen.sparkplug: names filled in). Kept in the state directory. Every metric
  // datatype: numbers, Boolean, String, Text, UUID, Bytes, File, DateTime, the arrays, DataSet, and Template - a PLC
  // struct or UDT, its definition in `templates` (published in the NBIRTH) and each Template metric an instance of one.
  rpc PutEdgeNode(SparkplugEdgeNodeSpec) returns (SparkplugEdgeNodeInfo);
  rpc GetEdgeNode(SparkplugEdgeNodeRef) returns (SparkplugEdgeNodeInfo);
  rpc ListEdgeNodes(Empty) returns (SparkplugEdgeNodeList);
  rpc DeleteEdgeNode(SparkplugEdgeNodeRef) returns (Empty);   // its NDEATH first; what it kept is dropped
  rpc SetValues(SparkplugValuesRequest) returns (SparkplugValuesReply);
  rpc SetDeviceState(SparkplugDeviceStateRequest) returns (Empty);  // DBIRTH (online) or DDEATH
  rpc RebirthEdgeNode(SparkplugEdgeNodeRef) returns (Empty);
}

message SparkplugEdgeNodeSpec {
  string id = 1;                   // this server's name for it
  string connection = 2;           // the connection it runs on
  string group = 3;
  string node = 4;
  string primary_host_id = 5;      // born only while that host's STATE is online; "": whenever connected
  repeated string devices = 6;
  repeated SparkplugMetricDeclaration metrics = 7;
  optional uint64 history_max = 8; // values kept while not born (default 100000; 0: none); full, the oldest go
  repeated SparkplugTemplateDefinition templates = 9;
}
// A Template definition the edge node publishes in its NBIRTH: the type of a PLC struct or UDT - its members (name,
// datatype, default value; a member may itself be a Template instance, an array or a DataSet) and its parameters.
// `definition.is_definition` is taken as true and `template_ref` must be empty. A metric declared with datatype
// DATATYPE_TEMPLATE is an instance: SetValues gives it a template_value whose template_ref is one of these names - in
// a birth with every member, in data with those that changed.
message SparkplugTemplateDefinition {
  string name = 1;                 // a metric name in the NBIRTH: not one of the node's own metrics
  SparkplugTemplate definition = 2;
}
message SparkplugMetricDeclaration {
  string name = 1;
  string device = 2;               // "": the node's own; else one of `devices`
  SparkplugDataType datatype = 3;
  bool writable = 4;               // a host may write it (NCMD/DCMD)
  string units = 5;                // engUnit
  optional double low = 6;         // engLow
  optional double high = 7;        // engHigh
  double deadband = 8;             // published only when it has moved this much...
  double deadband_percent = 9;     // ...or this percent of its range
}
message SparkplugEdgeNodeRef {
  string id = 1;
}
message SparkplugEdgeNodeInfo {
  SparkplugEdgeNodeSpec spec = 1;
  bool born = 2;
  uint32 bd_seq = 3;
  bool primary_host_online = 4;
  uint32 births = 5;
  uint64 history = 6;              // values kept, waiting to be sent as history
  uint64 history_lost = 7;
  repeated string devices_online = 8;
}
message SparkplugEdgeNodeList {
  repeated SparkplugEdgeNodeInfo edge_nodes = 1;
}
message SparkplugValuesRequest {
  string edge_node = 1;
  string device = 2;               // "": the node's own metrics
  repeated SparkplugMetric metrics = 3; // name, value, and a timestamp if not now
}
message SparkplugValuesReply {
  uint32 sent = 1;                 // set and published (deadbands, or no change, may hold some back)
  uint32 kept = 2;                 // not born: kept, sent as history once it is
  repeated string unknown = 3;     // names it never declared
  repeated string refused = 4;     // "name: why" - a value its metric cannot take (a template_ref it does not declare)
}
message SparkplugDeviceStateRequest {
  string edge_node = 1;
  string device = 2;
  bool online = 3;
}

// Every NBIRTH and DBIRTH the server's clients publish kept, retained, on
// $sparkplug/certificates/spBv1.0/<group>/NBIRTH/<node> (and .../DBIRTH/<node>/<device>), cleared by its death - so a
// host that starts late reads every dictionary without asking for a rebirth. Every login may read them, none write
// them. Turned off, what it put there is cleared.
message SparkplugAwareSetting {
  bool enabled = 1;
}

message SparkplugHostSpec {
  string id = 1;                   // this server's name for it
  string connection = 2;           // the connection it runs on (one host each)
  string host_id = 3;              // its Sparkplug Host Application id: spBv1.0/STATE/<host_id>
  string group = 4;                // the group it follows; "": every group
  optional bool rebirth_on_gap = 5; // ask for rebirths as above; absent: true
  optional uint32 reorder_timeout_ms = 6;        // how long a gap waits for the missing message (default 2000; 0: none)
  optional uint32 rebirth_min_interval_ms = 7;   // per node (default 60000)
}
message SparkplugHostRef {
  string id = 1;
}
message SparkplugHostInfo {
  SparkplugHostSpec spec = 1;
  bool online = 2;                 // its STATE is born, on a connection that is up
  uint64 nodes = 3;
  uint64 decode_failures = 4;
  uint64 rebirths_requested = 5;
}
message SparkplugHostList {
  repeated SparkplugHostInfo hosts = 1;
}

message SparkplugNodesRequest {
  string host = 1;
  string group = 2;                // "": every group
  string node = 3;                 // "": every node
}
message SparkplugNodesReply {
  repeated SparkplugNode nodes = 1;
}
message SparkplugNode {
  string group = 1;
  string node = 2;
  bool online = 3;
  optional uint64 bd_seq = 4;
  optional uint32 last_seq = 5;
  uint32 messages = 6;
  uint32 gaps = 7;
  uint32 rebirths_requested = 8;
  repeated string devices = 9;
  repeated SparkplugNodeMetric metrics = 10;
}
message SparkplugNodeMetric {
  string name = 1;
  string device = 2;               // "" for the node's own
  optional uint64 alias = 3;
  SparkplugDataType datatype = 4;
  SparkplugValue value = 5;        // the last; unset when there is none (or it was null)
  uint64 timestamp = 6;
}

message SparkplugRebirthRequest {
  string host = 1;
  string group = 2;
  string node = 3;
  string device = 4;               // "": the node
}
message SparkplugWriteRequest {
  string host = 1;
  string group = 2;
  string node = 3;
  string device = 4;               // "": an NCMD to the node; else a DCMD to it
  repeated SparkplugMetric metrics = 5; // by name; alias and datatype come from the birth where it gave them
}
message SparkplugCommandReply {
  bool sent = 1;
}

message SparkplugDecodeRequest {
  string topic = 1;                // spBv1.0/... (STATE included)
  bytes payload = 2;
}
message SparkplugEncodeRequest {
  SparkplugPayload payload = 1;
  bool compress = 2;               // DEFLATE, inside a SPBV1.0_COMPRESSED payload
}
message SparkplugEncodeReply {
  bytes payload = 1;
}

message SparkplugMessage {
  SparkplugKind kind = 1;
  string group = 2;
  string node = 3;
  string device = 4;               // DBIRTH, DDEATH, DDATA, DCMD
  string host_id = 5;              // STATE
  SparkplugPayload payload = 6;    // all but STATE
  bool online = 7;                 // STATE
  uint64 state_timestamp = 8;      // STATE
  string error = 9;                // it could not be read: why (the delivery still has the bytes)
  bool stale = 10;                 // a host on the connection: an NDEATH of a session already replaced - not a death
  bool gap = 11;                   // a host on the connection: seq skipped one or more
}

enum SparkplugKind {
  SPARKPLUG_KIND_UNSPECIFIED = 0;
  SPARKPLUG_NBIRTH = 1;
  SPARKPLUG_NDEATH = 2;
  SPARKPLUG_DBIRTH = 3;
  SPARKPLUG_DDEATH = 4;
  SPARKPLUG_NDATA = 5;
  SPARKPLUG_DDATA = 6;
  SPARKPLUG_NCMD = 7;
  SPARKPLUG_DCMD = 8;
  SPARKPLUG_STATE = 9;
}

message SparkplugPayload {
  optional uint64 timestamp = 1;
  repeated SparkplugMetric metrics = 2;
  optional uint64 seq = 3;
  string uuid = 4;
  bytes body = 5;
  bool compressed = 6;             // it arrived compressed (decoded: this is what was inside)
}

message SparkplugMetric {
  string name = 1;                 // "" in data that uses aliases (a host resolves them)
  optional uint64 alias = 2;
  optional uint64 timestamp = 3;
  SparkplugDataType datatype = 4;
  bool is_historical = 5;
  bool is_transient = 6;
  bool is_null = 7;
  SparkplugMetaData metadata = 8;
  repeated SparkplugProperty properties = 9;
  SparkplugValue value = 10;
}

// One of these, as `datatype` says: Int8..Int64 int_value; UInt8..UInt64 and DateTime (ms since 1970) uint_value;
// String, Text, UUID string_value; Bytes, File bytes_value; the arrays array_value; DataSet, Template theirs.
message SparkplugValue {
  oneof kind {
    int64 int_value = 1;
    uint64 uint_value = 2;
    float float_value = 3;
    double double_value = 4;
    bool boolean_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    SparkplugArray array_value = 8;
    SparkplugDataSet dataset_value = 9;
    SparkplugTemplate template_value = 10;
  }
}

// An array metric's elements, in the list its datatype names: Int8Array..Int64Array `ints`; UInt8Array..UInt64Array
// and DateTimeArray `uints`; FloatArray `floats`; DoubleArray `doubles`; BooleanArray `booleans`; StringArray `strings`.
message SparkplugArray {
  repeated int64 ints = 1;
  repeated uint64 uints = 2;
  repeated float floats = 3;
  repeated double doubles = 4;
  repeated bool booleans = 5;
  repeated string strings = 6;
}

message SparkplugProperty {
  string key = 1;
  SparkplugDataType type = 2;      // a scalar's, or PropertySet / PropertySetList
  bool is_null = 3;
  SparkplugValue value = 4;        // a scalar
  SparkplugPropertySet set = 5;    // PropertySet
  repeated SparkplugPropertySet sets = 6; // PropertySetList
}
message SparkplugPropertySet {
  repeated SparkplugProperty properties = 1;
}

message SparkplugDataSet {
  repeated string columns = 1;
  repeated SparkplugDataType types = 2;
  repeated SparkplugRow rows = 3;
}
message SparkplugRow {
  repeated SparkplugValue values = 1;
}

message SparkplugTemplate {
  string version = 1;
  repeated SparkplugMetric metrics = 2;
  repeated SparkplugParameter parameters = 3;
  string template_ref = 4;         // an instance: the definition it is of
  bool is_definition = 5;
}
message SparkplugParameter {
  string name = 1;
  SparkplugDataType type = 2;
  SparkplugValue value = 3;
}

message SparkplugMetaData {
  bool is_multi_part = 1;
  string content_type = 2;
  uint64 size = 3;
  uint64 seq = 4;
  string file_name = 5;
  string file_type = 6;
  string md5 = 7;
  string description = 8;
}

enum SparkplugDataType {
  DATATYPE_UNKNOWN = 0;
  DATATYPE_INT8 = 1;
  DATATYPE_INT16 = 2;
  DATATYPE_INT32 = 3;
  DATATYPE_INT64 = 4;
  DATATYPE_UINT8 = 5;
  DATATYPE_UINT16 = 6;
  DATATYPE_UINT32 = 7;
  DATATYPE_UINT64 = 8;
  DATATYPE_FLOAT = 9;
  DATATYPE_DOUBLE = 10;
  DATATYPE_BOOLEAN = 11;
  DATATYPE_STRING = 12;
  DATATYPE_DATETIME = 13;
  DATATYPE_TEXT = 14;
  DATATYPE_UUID = 15;
  DATATYPE_DATASET = 16;
  DATATYPE_BYTES = 17;
  DATATYPE_FILE = 18;
  DATATYPE_TEMPLATE = 19;
  DATATYPE_PROPERTY_SET = 20;
  DATATYPE_PROPERTY_SET_LIST = 21;
  DATATYPE_INT8_ARRAY = 22;
  DATATYPE_INT16_ARRAY = 23;
  DATATYPE_INT32_ARRAY = 24;
  DATATYPE_INT64_ARRAY = 25;
  DATATYPE_UINT8_ARRAY = 26;
  DATATYPE_UINT16_ARRAY = 27;
  DATATYPE_UINT32_ARRAY = 28;
  DATATYPE_UINT64_ARRAY = 29;
  DATATYPE_FLOAT_ARRAY = 30;
  DATATYPE_DOUBLE_ARRAY = 31;
  DATATYPE_BOOLEAN_ARRAY = 32;
  DATATYPE_STRING_ARRAY = 33;
  DATATYPE_DATETIME_ARRAY = 34;
}

// =============================================================================
// KAFKA - the clusters, and the mappings between this broker and Kafka topics
// =============================================================================
//
// The same fields as modbee.yaml's kafka: section (docs/kafka.md), named as it
// names them (kafka-acks there, kafka_acks here), and checked by the same
// rules: a loop between a mapping each way, a cluster no mapping can find, a
// Kafka topic name Kafka would refuse.

service Kafka {
  // Each change is applied live and all or nothing: it starts a new producer or consumer only where it touches one,
  // and a publisher's acknowledgement already waiting on Kafka is kept. Kept in the state directory (kafka.json), so
  // a server started from flags keeps them; a file's kafka: is where they start - what was changed here wins over
  // it, as EMQX keeps what its API changed over its configuration file. FAILED_PRECONDITION: no Kafka in this build.
  rpc PutCluster(KafkaCluster) returns (KafkaCluster);   // create, or replace by id
  rpc GetCluster(KafkaRef) returns (KafkaCluster);
  rpc ListClusters(Empty) returns (KafkaClusterList);
  rpc DeleteCluster(KafkaRef) returns (Empty);           // refused while a mapping or the retained store uses it
  rpc PutMapping(KafkaMapping) returns (KafkaMapping);   // create, or replace by id
  rpc GetMapping(KafkaRef) returns (KafkaMapping);
  rpc ListMappings(Empty) returns (KafkaMappingList);
  rpc DeleteMapping(KafkaRef) returns (Empty);
  // Each mapping's counters (the names HiveMQ's Kafka extension and /metrics use), the acknowledgements waiting on
  // Kafka now, and whether Kafka can be reached.
  rpc Status(Empty) returns (KafkaStatus);
}

message KafkaRef {
  string id = 1;
}

// kafka.clusters[]. A password is never given back: an answer has it empty and says `password_set`; a Put with it
// empty keeps the one the cluster has.
message KafkaCluster {
  string id = 1;
  repeated string bootstrap_servers = 2;   // host:port
  KafkaClusterTls tls = 3;                 // set: TLS
  KafkaClusterAuthentication authentication = 4;
  map<string, string> properties = 5;      // librdkafka settings, exactly as written ("linger.ms")
}
message KafkaClusterTls {
  string ca = 1;                           // files on the server
  string cert = 2;
  string key = 3;
  optional bool verify_hostname = 4;       // absent: true
}
message KafkaClusterAuthentication {
  string mechanism = 1;                    // none (default) | plain | scram-sha256 | scram-sha512 | oauthbearer
  string username = 2;
  string password = 3;
  string password_file = 4;                // a file on the server holding it, instead
  bool password_set = 5;                   // in an answer: it has one
}
message KafkaClusterList {
  repeated KafkaCluster clusters = 1;
}

// One mapping: kafka.mqtt-to-kafka[] or kafka.kafka-to-mqtt[].
message KafkaMapping {
  string id = 1;
  oneof direction {
    KafkaMqttToKafka mqtt_to_kafka = 2;
    KafkaKafkaToMqtt kafka_to_mqtt = 3;
  }
}
message KafkaMqttToKafka {
  string cluster = 1;                      // "": the only cluster there is
  repeated string mqtt_topic_filters = 2;
  string kafka_topic = 3;
  string kafka_acks = 4;                   // zero | one | all (default)
  optional uint64 max_record_bytes = 5;    // default 1048576
  string key = 6;                          // topic (default) | clientid | none | a template, as the file has it
  string headers = 7;                      // all | none (default) - or list them in header_list
  repeated KafkaHeader header_list = 8;
  string partition_strategy = 9;           // key-based (default) | uniform
  string acknowledge = 10;                 // kafka (default): the PUBACK waits for Kafka | routed
}
// One header a record gets: a placeholder (mqtt-topic, mqtt-qos, ...), or a fixed name and value.
message KafkaHeader {
  string placeholder = 1;
  string name = 2;
  string value = 3;
}
message KafkaKafkaToMqtt {
  string cluster = 1;
  repeated string kafka_topics = 2;
  string kafka_topic_pattern = 3;          // a regular expression, instead of kafka_topics
  repeated string mqtt_topic = 4;          // templates; default the record's own Kafka topic
  bool from_headers = 5;                   // topic, QoS, retain and properties from the mqtt-* headers
  optional uint32 qos = 6;                 // default 1
  bool retain = 7;
  string consumer_group = 8;               // default modbee-<id>-group
  KafkaMqttProperties properties = 9;      // MQTT 5 properties it publishes with
}
message KafkaMqttProperties {
  string content_type = 1;
  string response_topic = 2;
  optional uint32 payload_format_indicator = 3;
  optional uint32 message_expiry_interval = 4;
  repeated KafkaUserProperty user_properties = 5;
}
message KafkaUserProperty {
  string name = 1;
  string value = 2;
}
message KafkaMappingList {
  repeated KafkaMapping mappings = 1;
}

message KafkaStatus {
  bool reachable = 1;                      // false from "every broker is down" until one is up again
  uint64 held_acknowledgements = 2;        // PUBACKs and PUBRECs waiting on Kafka now
  repeated KafkaMappingStatus mappings = 3;
}
// Running totals since the mapping was made (a change to it keeps them).
message KafkaMappingStatus {
  string id = 1;
  bool to_kafka = 2;
  uint64 send = 3;                         // mqtt-to-kafka: handed to the producer
  uint64 success = 4;                      //   Kafka has it
  uint64 failed = 5;
  uint64 too_large = 6;                    //   over max_record_bytes, never sent
  uint64 latency_micros = 7;               //   summed over success
  uint64 polled = 8;                       // kafka-to-mqtt: records read
  uint64 published = 9;
  uint64 invalid = 10;                     //   could not be published (a topic that is not one, ...)
  uint64 refused = 11;                     //   the broker could not take it
}

// =============================================================================
// CONNECTIONS - MQTT client connections the broker keeps for the application
// =============================================================================
//
// Other brokers (a customer's, a Sparkplug host on a foreign broker), the
// Sparkplug edge node, the gateway's uplink to the platform. The broker owns
// them: they are kept in its data directory and stay up while the
// application restarts. Messages in come through Messages.Consume with
// `connection` set; messages out through Messages.Publish with it set.

service Connections {
  rpc Put(ConnectionSpec) returns (ConnectionInfo);   // create, or replace by id (unchanged: no reconnect)
  rpc Get(ConnectionRef) returns (ConnectionInfo);
  rpc List(ListConnectionsRequest) returns (ListConnectionsReply);
  rpc Delete(ConnectionRef) returns (DeleteConnectionReply);
  rpc Watch(WatchConnectionsRequest) returns (stream ConnectionInfo); // every change of state
  rpc Reconnect(ReconnectRequest) returns (ConnectionInfo);
}

message ConnectionSpec {
  string id = 1;
  repeated Endpoint servers = 2;   // in priority order: failover down the list, back to the first when it is healthy
  string client_id = 3;
  optional string username = 4;
  optional bytes password = 5;     // never read back
  ClientTls tls = 6;
  uint32 protocol_version = 7;     // 5 (default) or 4
  uint32 keepalive_seconds = 8;    // default 30
  bool clean_start = 9;
  uint32 session_expiry_seconds = 10;
  Message will = 11;
  ReconnectMode reconnect = 12;
  uint32 primary_check_seconds = 13; // how often a lower-priority connection checks the first server (default 60)
  StoreAndForward store_and_forward = 14;
  // MQTT 5 CONNECT. The Will's properties are will.properties; these are the rest.
  uint32 will_delay_seconds = 15;
  uint32 receive_maximum = 16;     // QoS 1/2 messages the other broker may have in flight to it; 0: 65535
  uint32 topic_alias_maximum = 17; // 0: none
  uint32 maximum_packet_size = 18; // the largest it takes; 0: no limit
  // This server itself, as one of its own clients - `servers` not needed: what a Sparkplug host or edge node on the
  // server's own devices runs on. Over loopback, on the plain listener (or the TLS one), with a login the server
  // keeps for it - an ordinary one: every topic but the $ ones.
  bool this_server = 19;
}

// What a bridge does (EMQX's buffer, HiveMQ Edge, Mosquitto's bridge queue): every publish on the connection is
// written to disk (connections' outbox.db) before it is answered, and leaves only when the other broker has
// acknowledged it - so a connection that is down, a restart or a crash loses none, and they go in order, at QoS 1 or
// more. A message whose Message Expiry Interval runs out while it waits is not sent. Delete drops what it holds.
message StoreAndForward {
  bool enabled = 1;
  uint64 max_messages = 2;         // default 100000
  uint64 max_bytes = 3;            // topics and payloads; default 67108864
  WhenFull when_full = 4;
}

enum WhenFull {
  WHEN_FULL_REFUSE = 0;            // the new message is refused (0x97), the kept ones go first (the default)
  WHEN_FULL_DROP_OLDEST = 1;       // the oldest is given up, and counted
}

message Endpoint {
  string host = 1;
  uint32 port = 2;                 // default 1883, or 8883 with TLS
}

message ClientTls {
  bool enabled = 1;
  string ca_pem = 2;               // "" the system's trust store
  string certificate_pem = 3;      // client certificate, for mutual TLS
  string key_pem = 4;              // never read back
  string server_name = 5;          // SNI and the name checked; "" the endpoint's host
}

enum ReconnectMode {
  RECONNECT_AUTOMATIC = 0;
  // After a drop, wait for Reconnect() - which can bring a new Will. A
  // Sparkplug edge node needs this: each session's NDEATH carries a new bdSeq.
  RECONNECT_WHEN_ASKED = 1;
}

message ConnectionRef {
  string id = 1;
}

message ReconnectRequest {
  string id = 1;
  Message will = 2;                // replaces the Will from this connect on, when set
}

message ConnectionInfo {
  ConnectionSpec spec = 1;         // as stored, secrets left out
  ConnectionState state = 2;
  uint32 server_index = 3;         // which of spec.servers it is on
  bool session_present = 4;
  string last_error = 5;
  int64 since_ms = 6;
  uint64 messages_in = 7;
  uint64 messages_out = 8;
  uint64 stored = 9;               // store and forward: held for the other broker now
  uint64 stored_bytes = 10;
  int64 oldest_stored_ms = 11;     // when the oldest of them was taken (ms since 1970 UTC); 0: none
  uint64 stored_dropped = 12;      // given up to make room (WHEN_FULL_DROP_OLDEST)
  uint64 stored_expired = 13;      // their Message Expiry Interval ran out while they waited
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_CONNECTING = 1;
  CONNECTION_CONNECTED = 2;
  CONNECTION_WAITING = 3;          // RECONNECT_WHEN_ASKED, dropped, waiting for Reconnect()
  CONNECTION_BACKING_OFF = 4;      // dropped or refused, trying again shortly
  CONNECTION_REFUSED = 5;          // the server refused the login: not retried until Put or Reconnect
}

message ListConnectionsRequest {}
message ListConnectionsReply {
  repeated ConnectionInfo connections = 1;
}
message DeleteConnectionReply {}
message WatchConnectionsRequest {
  repeated string ids = 1;         // empty: all
}

// =============================================================================
// ADMIN - the broker's own state. Also served as REST (internal/APP-API-SPEC.md section 5)
// =============================================================================

service Admin {
  // Logins and site keys, where the broker keeps them (authentication:
  // database). Where an authority decides logins they are the
  // application's: these answer FAILED_PRECONDITION.
  rpc ListLogins(ListRequest) returns (ListLoginsReply);
  rpc GetLogin(NameRef) returns (Login);
  rpc PutLogin(PutLoginRequest) returns (PutLoginReply);
  rpc DeleteLogin(NameRef) returns (DeleteReply);
  rpc ResetLogin(NameRef) returns (PutLoginReply);           // a new secret; its connections are closed
  rpc ListKeys(ListRequest) returns (ListKeysReply);
  rpc PutKey(SiteKey) returns (PutKeyReply);
  rpc DeleteKey(NameRef) returns (DeleteReply);

  rpc ListSessions(ListSessionsRequest) returns (ListSessionsReply);
  rpc Kick(KickRequest) returns (KickReply);

  rpc ListRetained(ListRetainedRequest) returns (ListRetainedReply);
  rpc DeleteRetained(DeleteRetainedRequest) returns (DeleteReply);

  rpc GetListeners(Empty) returns (Listeners);
  rpc PutTls(ServerTls) returns (Listeners);                 // applied live: new handshakes use it
  // Ports, listeners on or off, the limits - applied live, all or nothing. A listener whose port moves keeps its
  // connections; one turned off closes them (MQTT 5: 0x98). Like PutTls, not kept: a restart is as it was started.
  rpc PutListeners(ListenersChange) returns (Listeners);

  rpc Stats(Empty) returns (StatsReply);

  // The settings kept in the login database (serve --data, or authentication: database): what `modbee-mqtt config`
  // reads and changes. Validated as the file is; applied at the next start - or at once, with `restart` - but for
  // the TLS material, which is applied live. Authentication is the file's and the flags' alone. Without a login
  // database: FAILED_PRECONDITION.
  rpc GetSettings(Empty) returns (Settings);
  rpc CheckSettings(SettingsChange) returns (SettingsResult);   // would these be accepted? the problems, if not
  rpc SetSettings(SettingsChange) returns (SettingsResult);     // `set` and `remove` single settings
  rpc ApplySettings(SettingsChange) returns (SettingsResult);   // `document`: a whole modbee.yaml, in place of the file
  rpc ResetSettings(SettingsChange) returns (SettingsResult);   // back to the file (or the defaults) alone
}

message Empty {}

message NameRef {
  string name = 1;
}

message ListRequest {
  string prefix = 1;
  uint32 page_size = 2;            // default 100, at most 1000
  string page_token = 3;
}

message Login {
  string name = 1;
  bool enabled = 2;
  bool pending = 3;                // registered with a key that wants approval
  bool admin = 4;
  repeated string publish = 5;
  repeated string subscribe = 6;
  string fingerprint = 7;
  string site = 8;
  string made_by = 9;              // "hand", or the key it registered with
  map<string, string> data = 10;
}
message ListLoginsReply {
  repeated Login logins = 1;
  uint64 total = 2;
  string next_page_token = 3;
}
message PutLoginRequest {
  Login login = 1;
  optional bytes password = 2;     // absent on a new login: one is generated and returned
  bool approve = 3;                // a pending login is let in
}
message PutLoginReply {
  Login login = 1;
  string password = 2;             // only when the broker generated it: shown once
}

message SiteKey {
  string name = 1;
  string site = 2;
  bool manual_approval = 3;
  uint32 uses = 4;                 // 0: no limit
  int64 expires_ms = 5;            // 0: never
  string device = 6;               // may register only this device
  repeated string publish = 7;
  repeated string subscribe = 8;
  map<string, string> data = 9;
  uint32 used = 10;                // read only
}
message ListKeysReply {
  repeated SiteKey keys = 1;
  string next_page_token = 2;
}
message PutKeyReply {
  SiteKey key = 1;
  string secret = 2;               // a new key's "<name>.<secret>": shown once
}

message DeleteReply {
  uint64 removed = 1;
}

message ListSessionsRequest {
  string client_id_prefix = 1;
  string login = 2;
  bool connected_only = 3;
  uint32 page_size = 4;
  string page_token = 5;
}
message Session {
  string client_id = 1;
  string login = 2;
  bool connected = 3;
  string address = 4;
  uint32 protocol_version = 5;
  int64 connected_since_ms = 6;
  uint32 expiry_seconds = 7;
  repeated string subscriptions = 8;
  uint64 queued = 9;
  uint64 in_flight = 10;
  // Is it talking: since the session began (kept across a clean start by the same client and login; not across a
  // restart of the server), the connection that is up included.
  uint64 messages_in = 11;         // PUBLISHes it sent
  uint64 messages_out = 12;        // PUBLISHes it was sent
  uint64 bytes_in = 13;            // every byte it sent, MQTT packets whole (TLS: what was decrypted)
  uint64 bytes_out = 14;
  int64 last_activity_ms = 15;     // its last packet (ms since 1970 UTC); 0: none yet
  uint32 connects = 16;            // CONNECTs that took this session: more than 1, it has reconnected
}
message ListSessionsReply {
  repeated Session sessions = 1;
  string next_page_token = 2;
}
message KickRequest {
  oneof target {
    string client_id = 1;
    string login = 2;
  }
  bool discard_session = 3;        // also end the session, not only the connection
}
message KickReply {
  uint32 closed = 1;
}

message ListRetainedRequest {
  string filter = 1;               // default "#"
  bool payloads = 2;               // include payloads (default: topics and sizes only)
  uint32 page_size = 3;
  string page_token = 4;
}
message RetainedMessage {
  Message message = 1;
  uint32 size = 2;
  int64 stored_ms = 3;
}
message ListRetainedReply {
  repeated RetainedMessage messages = 1;
  string next_page_token = 2;
}
message DeleteRetainedRequest {
  string filter = 1;               // a topic, or a filter for several
}

message ServerTls {
  string certificate_pem = 1;
  string key_pem = 2;              // never read back
  string client_ca_pem = 3;
  bool client_certificate_optional = 4;
}
message ListenersChange {
  optional uint32 port = 1;            // the plain listener's port; 0: off. Absent: as it is
  optional uint32 tls_port = 2;        // the TLS listener's port; 0: off. On needs a certificate: `tls`, or the one it had
  ServerTls tls = 3;                   // with tls_port: the certificate to serve, as PutTls
  optional uint64 max_connections = 4; // the whole server's, up to Listeners.max_connections_ceiling
  optional uint32 max_packet = 5;      // bytes, 64 to 268435455; a connection already up keeps what it was told
  // What a session may hold, as `serve --queue`, `--queue-bytes`, `--queue-bytes-total`. A queue already over a
  // lowered cap keeps what it holds and refuses new messages, counted as dropped, until it drains below it.
  optional uint32 queue = 6;             // messages per session, 1 to 1000000
  optional uint64 queue_bytes = 7;       // bytes per session; 0: no cap
  optional uint64 queue_bytes_total = 8; // bytes in every session together, the whole server's; 0: no cap
}
message Listeners {
  repeated ListenerInfo listeners = 1;
  uint64 max_connections = 2;
  uint64 max_connections_ceiling = 3;  // how far max_connections can be raised live: the room kept for sessions at start
  uint32 max_packet = 4;
  uint32 queue = 5;
  uint64 queue_bytes = 6;
  uint64 queue_bytes_total = 7;
}
message ListenerInfo {
  Listener kind = 1;
  string address = 2;
  uint32 port = 3;
  string certificate_subject = 4;  // TLS
  int64 certificate_expires_ms = 5;
}

message Settings {
  string source = 1;                   // "file", or "database": a document stored in place of the file
  string file = 2;                     // the file the server started with; "" for none
  string document = 3;                 // the YAML in force, secrets left out
  map<string, string> overrides = 4;   // single settings stored over it, by path ("broker.port": "1884")
  repeated string pinned = 5;          // paths the environment sets, which win
  repeated SettingProblem problems = 6;
  bool restart_required = 7;           // the running server is behind what is stored
}
message SettingsChange {
  map<string, string> set = 1;         // path to value, as modbee.yaml names it; a list comma-separated
  repeated string remove = 2;          // stored single settings to drop
  optional string document = 3;        // ApplySettings, CheckSettings: a whole modbee.yaml
  bool restart = 4;                    // restart once it is stored, if it needs one
}
message SettingsResult {
  repeated SettingProblem problems = 1;   // CheckSettings: why not; the others: warnings
  bool restart_required = 2;
  bool restarting = 3;
  bool tls_applied = 4;                // the TLS material changed, and the listeners serve it now
}
message SettingProblem {
  string path = 1;
  string message = 2;
  uint32 line = 3;                     // in the document; 0: not about one place
  bool warning = 4;                    // reported, but the settings still load
}

message StatsReply {
  uint64 connections = 1;
  uint64 sessions = 2;
  uint64 subscriptions = 3;
  uint64 retained = 4;
  uint64 messages_in = 5;
  uint64 messages_out = 6;
  uint64 dropped = 7;
  uint64 refused_connects = 8;
  uint64 authority_asked = 9;
  uint64 authority_cached = 10;
  uint64 authority_stale = 11;     // answered from an expired decision while the authority was away
  uint32 shards = 12;
  int64 started_ms = 13;
  uint64 queued_messages = 14;     // held for sessions right now, every session together
  uint64 queued_bytes = 15;
}
