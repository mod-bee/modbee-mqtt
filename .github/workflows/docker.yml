# The modbee-mqtt image: built from docker/Dockerfile, tested, and published
# to the GitHub Container Registry as ghcr.io/mod-bee/modbee-mqtt.
#
#   push to main       -> :main and :latest (latest follows main until the first release)
#   tag v1.2.3         -> :1.2.3, :1.2, and :latest
#   pull request       -> built and tested, never pushed
#
# amd64 and arm64 (a Raspberry Pi, an ARM cloud server), each BUILT AND TESTED
# ON ITS OWN KIND OF MACHINE, side by side: arm64 on GitHub's ARM runner rather
# than emulated on an amd64 one, which made the C++ build about ten times
# slower (half an hour). Each image is tested before anything is pushed - a
# container is started and a QoS 1 message is published through it - and only
# then pushed by digest; the last job joins the two digests under the tags, so
# a tag never points at an image that does not run, on either architecture.
#
# Nothing to configure for GHCR - the workflow's own GITHUB_TOKEN publishes.
# The first push creates the package as private; make it public once under
# the repository's Packages settings.

name: docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docker/Dockerfile"
      - ".dockerignore"
      - "CMakeLists.txt"
      - "src/**"
      - "server/**"
      - "cli/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: build and test (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Platform name for artifacts and the cache
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Built for this runner's own architecture and loaded, so it can be tested.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: modbee-under-test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Test the image
        run: |
          set -euo pipefail
          # A configuration file validates inside the image - and a command
          # given to the image runs that command, not the broker.
          docker run --rm modbee-under-test check -C /etc/modbee/modbee.yaml
          # The broker starts, and a QoS 1 publish through it is acknowledged.
          docker run -d --name under-test modbee-under-test --metrics-port 9464
          for _ in $(seq 1 30); do
            docker run --rm --network container:under-test modbee-under-test \
              pub -h 127.0.0.1 -t ci/check -m ok -q 1 && break
            sleep 1
          done
          docker run --rm --network container:under-test modbee-under-test \
            pub -h 127.0.0.1 -t ci/check -m ok -q 1
          # Every command reaches modbee, not the broker: an unknown one would
          # start a second broker instead of answering.
          for command in user key provision backup restore; do
            docker run --rm modbee-under-test "$command" --help > /dev/null
          done
          # And it reports itself.
          docker run --rm --network container:under-test --entrypoint bash modbee-under-test \
            -c 'exec 3<>/dev/tcp/127.0.0.1/9464 && printf "GET /metrics HTTP/1.0\r\n\r\n" >&3 && grep -q modbee_connections <&3'
          # And it stops cleanly on SIGTERM, as docker stop sends.
          docker stop under-test
          test "$(docker inspect -f '{{.State.ExitCode}}' under-test)" = 0
          docker logs under-test | tail -3
          docker rm under-test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tested image, pushed by digest only - no tag yet. The same build,
      # from the cache the step above filled.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Keep the digest for the tags
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Both architectures built, tested and pushed: one tag for both.
  tags:
    name: tag amd64 + arm64
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: One manifest for both, under every tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Show it
        run: docker buildx imagetools inspect '${{ env.IMAGE }}:${{ steps.meta.outputs.version }}'
