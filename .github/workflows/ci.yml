# What GitHub runs on every push: the published tree builds, and the
# published test suite (test/) passes - on Linux, macOS and Windows.
#
# The development checks (sanitizers over the whole development suite,
# fuzzing, the soak, TLS, the Arduino sketches, footprint ...) need
# internal/, scripts/ and docker/testing/, which are not published. They run
# before a push with internal/ci-local.sh.
#
# This one builds the published tree three ways - default, -Werror, and the
# -fno-exceptions build a microcontroller gets - with every C++ example, on
# Linux and macOS. A header that stops compiling, a source missing from
# CMakeLists.txt, an example that rots: each turns it red.

name: CI

on:
  push:
  pull_request:

jobs:
  # THE ONE JOB THAT NEEDS NOTHING PRIVATE, and the only signal a published
  # clone has. Three builds, because each catches something the others do not:
  #
  #   default        what `cmake -S . -B build` gives somebody who just cloned
  #   -Werror        no warnings, which is how the MCU toolchains are run
  #   MCU            -fno-exceptions -fno-rtti, which is what a board and a
  #                  generated wrapper give you
  #
  # There was a fourth, "every optional role together", passing the
  # MQTT_WITH_* flags. Those were deleted, so it built exactly the same
  # library as the default and burned a runner proving it twice.
  #
  # Plus every C++ example, which is what stops an example rotting quietly.
  published-tree:
    name: the published tree builds
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Default build, as a user would get it
        run: |
          cmake -S . -B build-default -DMQTT_BUILD_TESTS=OFF
          cmake --build build-default -j
      - name: No warnings anywhere
        run: |
          cmake -S . -B build-werror -DMQTT_BUILD_TESTS=OFF \
                -DCMAKE_CXX_FLAGS="-Werror"
          cmake --build build-werror -j
      - name: The build a microcontroller gets
        run: |
          cmake -S . -B build-client -DMQTT_BUILD_TESTS=OFF \
                -DMQTT_NO_EXCEPTIONS=ON -DCMAKE_CXX_FLAGS="-Werror"
          cmake --build build-client -j

  # THE PUBLISHED TEST SUITE: the wire format, the broker and client end to
  # end over loopback, and - where the server is built - the server across
  # shards and restarts. Nothing but a compiler and this repository.
  tests:
    name: the published tests pass
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4 --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # The same suite under the address and undefined-behaviour sanitizers.
  tests-sanitized:
    name: the published tests pass under ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DMQTT_SANITIZE=ON
          cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # THE SERVER ON WINDOWS, AS IT SHIPS: modbee.exe with everything - the CLI,
  # the server, the Kafka pipe and the Application API (librdkafka, gRPC and
  # protobuf from vcpkg, statically linked, cached between runs) - built by
  # MSVC; the published tests; and the Windows service installed, used,
  # stopped and removed on a real Service Control Manager.
  windows-server:
    name: Windows - modbee.exe with Kafka and the API, and the service
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      TRIPLET: x64-windows-static-release
    steps:
      - uses: actions/checkout@v4
      # gRPC built from source is most of an hour on a Windows runner. Once,
      # then cached - and saved even when a later step fails, so a red run
      # never throws away what it built.
      - name: vcpkg packages, restored
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.TRIPLET }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ env.TRIPLET }}-
      - name: Dependencies (vcpkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          # One triplet for the target and the host, release only, built on
          # the work drive and cleaned as it goes: C: is too small for gRPC.
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install grpc protobuf librdkafka openssl `
            --overlay-triplets=.github/vcpkg-triplets --triplet $env:TRIPLET --host-triplet $env:TRIPLET `
            --x-buildtrees-root=D:\vcpkg-bt --x-packages-root=D:\vcpkg-pk --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: vcpkg packages, saved
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.TRIPLET }}-${{ github.run_id }}
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/.github/vcpkg-triplets" `
            -DVCPKG_TARGET_TRIPLET=$env:TRIPLET -DVCPKG_HOST_TRIPLET=$env:TRIPLET `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DMQTT_BUILD_APP_API=ON | Tee-Object -FilePath configure.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Everything, or a red build: a modbee.exe without Kafka or the API
          # would pass every test below and still not be what ships.
          foreach ($part in 'librdkafka .* found', 'gRPC .* found', 'OpenSSL found') {
            if (-not (Select-String -Path configure.txt -Pattern $part)) { Write-Error "not found: $part"; exit 1 }
          }
          cmake --build build --config Release -j 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & build\cli\Release\modbee.exe --version
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: The Windows service
        shell: pwsh
        run: |
          $m = "build\cli\Release\modbee.exe"
          & $m service install --name modbee-ci -- --port 18850 --shards 2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $m service start --name modbee-ci
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:ProgramData\ModBee\modbee-ci.log"; exit 1 }
          $sub = Start-Process -FilePath $m -ArgumentList 'sub','-p','18850','-t','ci/#','-q','1','-C','5' `
                   -RedirectStandardOutput sub.txt -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          1..5 | ForEach-Object { & $m pub -p 18850 -t ci/x -m "message-$_" -q 1 }
          $sub.WaitForExit(15000) | Out-Null
          $got = (Select-String -Path sub.txt -Pattern '^message-[0-9]$').Count
          Write-Host "received through the service: $got of 5"
          & $m service stop --name modbee-ci
          Start-Sleep -Seconds 10
          & $m service status --name modbee-ci
          $stillStopped = $LASTEXITCODE -eq 1
          & $m service uninstall --name modbee-ci
          Write-Host "--- the service's log"
          Get-Content "$env:ProgramData\ModBee\modbee-ci.log"
          if ($got -ne 5) { Write-Error "the service passed $got of 5 messages"; exit 1 }
          if (-not $stillStopped) { Write-Error "the service did not stay stopped"; exit 1 }
